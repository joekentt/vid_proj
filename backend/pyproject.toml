[project]
name = "ai-video-studio-backend"
version = "0.1.0"
description = "API e orquestração do AI Video Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "boto3>=1.35",
    "python-multipart>=0.0.12",  # UploadFile (POST /assets/images)
    "pillow>=10.0",              # storyboard (grade de frames) na API
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",  # ffmpeg estático p/ testes e dev local (API usa o do apt)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
